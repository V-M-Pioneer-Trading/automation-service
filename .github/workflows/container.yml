name: container

on:
  # No branch filter: a pull request stacked on another branch needs the same
  # checks as one targeting main. Filtering to main meant a stacked PR ran
  # nothing at all and looked green by default.
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Runs on pull requests *and* on push: previously a direct push to main
  # skipped the tests entirely and went straight to build-and-deploy. The
  # Postgres service below is attached to the job, not to the event, so it
  # comes up for a push run exactly as it does for a pull request one.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: automation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/automation_test

  docker:
    if: github.event_name == 'push'
    needs: test
    # Deploy credentials live on this job alone. Declared at workflow level they
    # reached the test job too, and since that job now runs on pushes to main its
    # OIDC token would satisfy the deploy role's trust policy: npm install scripts
    # and test code could have assumed the role that redeploys production.
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/v-m-pioneer-trading/automation-service
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::543292785457:role/github-actions-ssm-deploy
          aws-region: eu-central-1

      - name: Trigger redeploy on shared host
        run: |
          aws ssm send-command \
            --document-name "automation-service-bootstrap-i-011b6b82a9072a385" \
            --targets "Key=InstanceIds,Values=i-011b6b82a9072a385" \
            --region eu-central-1
