name: container

on:
  # No branch filter: a pull request stacked on another branch needs the same
  # checks as one targeting main. Filtering to main meant a stacked PR ran
  # nothing at all and looked green by default.
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

# One deploy at a time, in the order the runs were triggered. On 2026-09-25
# auth-service #5 and #6 merged seconds apart; their runs overlapped, #5's older
# commit pushed :latest last and its redeploy ran last, so production ran
# without #6's fix until #6's run was re-run by hand.
#
# At workflow level rather than on the deploy job: a job-level group is entered
# only when the job starts, i.e. when the test job finishes, so a slower test
# run on the older commit could still take the slot second and deploy last.
#
# Every run that can deploy shares one group: a push to main, and a v* tag,
# whose run triggers the same redeploy of :latest. Both replace the same
# production container.
#
# cancel-in-progress stays false so a run is never killed halfway through a
# push or a host restart. GitHub keeps at most one run pending per group and a
# newer one replaces it, so a burst of merges still ends with the newest commit
# deployed. Pull request runs deploy nothing and each get a group of their own:
# no queueing.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.run_id) || format('deploy-{0}-main', github.repository) }}
  cancel-in-progress: false

jobs:
  # Runs on pull requests *and* on push: previously a direct push to main
  # skipped the tests entirely and went straight to build-and-deploy. The
  # Postgres service below is attached to the job, not to the event, so it
  # comes up for a push run exactly as it does for a pull request one.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: automation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/automation_test

  docker:
    if: github.event_name == 'push'
    needs: test
    # Deploy credentials live on this job alone. Declared at workflow level they
    # reached the test job too, and since that job now runs on pushes to main its
    # OIDC token would satisfy the deploy role's trust policy: npm install scripts
    # and test code could have assumed the role that redeploys production.
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/v-m-pioneer-trading/automation-service
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::543292785457:role/github-actions-ssm-deploy
          aws-region: eu-central-1

      # Waits for the host to finish, not only for SSM to accept the command.
      # send-command returns as soon as the command is queued, so without the
      # wait this job, and the concurrency slot above, were released while the
      # host was still pulling and restarting, and a bootstrap that failed its
      # health check left the run green. The SSM output is not printed here:
      # these logs are public and the bootstrap's failure path dumps container
      # logs. Read it in the SSM console under the command ID echoed below.
      - name: Redeploy on shared host
        env:
          INSTANCE_ID: i-011b6b82a9072a385
          DOCUMENT: automation-service-bootstrap-i-011b6b82a9072a385
        run: |
          command_id=$(aws ssm send-command \
            --document-name "$DOCUMENT" \
            --targets "Key=InstanceIds,Values=$INSTANCE_ID" \
            --region eu-central-1 \
            --query Command.CommandId --output text)
          echo "SSM command $command_id"
          # Up to 15 minutes: the bootstrap allows ~90 s for /health on top of
          # the image pulls.
          for _ in $(seq 90); do
            sleep 10
            # Fails for a moment right after send-command, before the
            # invocation is registered.
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --region eu-central-1 --query Status --output text) || status=Pending
            case "$status" in
              Pending|InProgress|Delayed) continue ;;
              Success) exit 0 ;;
            esac
            echo "::error::Redeploy $command_id ended with status $status"
            exit 1
          done
          echo "::error::Redeploy $command_id still running after 15 minutes"
          exit 1
